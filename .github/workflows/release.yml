name: release
on:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:assembleDebug
      - name: Publicar
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk cerrojo-${{ github.ref_name }}.apk
          gh release create "${{ github.ref_name }}" "cerrojo-${{ github.ref_name }}.apk" \
            --title "Cerrojo ${{ github.ref_name }}" \
            --notes "Descarga el APK desde el móvil e instálalo encima de la versión anterior."
        env:
          GH_TOKEN: ${{ github.token }}
